line-length = 120
target-version = "py311"
extend-exclude = [".venv", "data"]

[lint]
select = ["F", "E", "I", "UP", "B"]
ignore = [
    "E501",   # long lines
    "B008",   # function calls in defaults (FastAPI Depends/File/Form)
]

[lint.per-file-ignores]
# sys.path / load_dotenv must run before project imports
"app.py" = ["E402"]
"mcp_server.py" = ["E402"]
"tests/conftest.py" = ["E402"]
