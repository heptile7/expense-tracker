<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expenses: offline</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #f9f9f7; color: #0b0b0b; text-align: center; }
    @media (prefers-color-scheme: dark) { body { background: #0d0d0d; color: #f0efec; } }
    h1 { font-size: 22px; margin: 16px 0 8px; }
    p { max-width: 30ch; margin: 0 auto 20px; }
    button { font: inherit; padding: 12px 24px; border-radius: 12px; border: 0; background: #2a78d6; color: #fff; }
  </style>
</head>
<body>
  <main>
    <img src="/static/icons/icon-192.png" width="72" height="72" alt="">
    <h1>Can't reach the app</h1>
    <p>The computer that runs Expenses is off, asleep, or not connected. Check it's on and connected to the internet, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
